name: Backend CI

on:
  push:
    branches:
      - main
      - backend-development
  pull_request:
    branches:
      - main
      - backend-development

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: train_user
          POSTGRES_PASSWORD: train_password
          POSTGRES_DB: train_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U train_user -d train_booking_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure test environment
        run: |
          echo "DATABASE_URL=postgresql+psycopg://train_user:train_password@localhost:5432/train_booking_test" >> "$GITHUB_ENV"
          echo "SECRET_KEY=test-secret-key-for-ci" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/backend" >> "$GITHUB_ENV"

      - name: Run database migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: |
          python -m pytest -v

      - name: Check Python imports
        working-directory: backend
        run: |
          python -c "from app.main import app; print('FastAPI application imported successfully')"
