name: Backend CI

on:
  push:
    branches:
      - main
      - backend-development
  pull_request:
    branches:
      - main
      - backend-development

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: postgresql+psycopg://train_user:train_password@localhost:5432/train_booking_test
      SECRET_KEY: test-secret-key-for-ci
      PYTHONPATH: ${{ github.workspace }}/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: train_user
          POSTGRES_PASSWORD: train_password
          POSTGRES_DB: train_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U train_user -d train_booking_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python and environment
        working-directory: backend
        run: |
          python --version
          python -c "import sys; print(sys.path)"
          python -c "import fastapi, sqlalchemy, psycopg, pytest; print('Dependencies imported successfully')"

      - name: Run database migrations
        working-directory: backend
        run: timeout 120s alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: timeout 120s python -m pytest -v -s

      - name: Check Python imports
        working-directory: backend
        run: |
          python -c "from app.main import app; print('FastAPI application imported successfully')"
