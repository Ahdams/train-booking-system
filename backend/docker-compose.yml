services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: train_booking
      POSTGRES_USER: train_user
      POSTGRES_PASSWORD: train_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://train_user:train_password@db:5432/train_booking
      SECRET_KEY: change-this-in-production
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
